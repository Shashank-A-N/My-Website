name: Deploy to GitHub Pages

on:
  # Trigger the workflow on push to the main branch
  push:
    branches: ["main"] # Change to 'master' if your default branch is master
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# --- THE FIX STARTS HERE ---
# This cancels any previous run that is still in progress when a new one starts
concurrency:
  group: "pages"
  cancel-in-progress: true
# --- THE FIX ENDS HERE ---

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # IMPORTANT: Verify your build output folder. 
          # Vite uses './dist', Create-React-App uses './build'
          path: ./dist 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
